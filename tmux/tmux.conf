##### Terminal & Colors #####

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
set -g mouse on

##### Prefix #####

unbind C-b
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

##### Indexing #####

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

##### Pane Navigation #####

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

##### Window Navigation #####

bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

##### Window and Splits in Current Dir #####

bind c new-window -c "#{pane_current_path}"

bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

##### Copy Mode (Vi) #####

set -g mode-keys vi
bind-key -T copy-mode-vi v    send-keys -X begin-selection
bind-key -T copy-mode-vi C-v  send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y    send-keys -X copy-selection-and-cancel

##### Catppuccin #####

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_status_enabled "no"
# set -g @catppuccin_host_text "#h"

# Minimal status layout
set -g status-style "bg=#1e1e2e"
set -g status-left "#[fg=#89b4fa,bold]  #{user} "
set -g status-right "#[fg=#a6e3a1] #S   %H:%M "

# Rounded window style
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_modules_right "date_time"

##### Plugins #####

# Initialize TMUX plugin manager (keep this at bottom)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#3.4'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin "tmux-plugins/tmux-resurrect"

run '~/.config/tmux/plugins/tpm/tpm'
